# Builds NetSentinel.exe on a real Windows machine in the cloud - free for public repos.
#
# How to use it (no Windows PC needed):
#   1. Create a free account at github.com and a new repository.
#   2. Upload this folder (drag the files into the browser page, or use GitHub Desktop).
#   3. Go to the "Actions" tab, pick "Build Windows EXE", press "Run workflow".
#   4. When it finishes, download "NetSentinel-windows" from the run page - it contains
#      NetSentinel.exe (single file, Python bundled, nothing to install).
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the single-file exe
        run: |
          python sbom.py
          pyinstaller --onefile --name NetSentinel ^
            --icon netsentinel.ico ^
            --add-data "netscan;netscan" ^
            --hidden-import netscan.webui ^
            --hidden-import netscan.report ^
            --hidden-import netscan.remote ^
            --hidden-import netscan.poll ^
            --hidden-import netscan.netflow ^
            --hidden-import netscan.syslogrx ^
            --hidden-import netscan.alerts ^
            --hidden-import netscan.auth ^
            --hidden-import netscan.diagnose ^
            --hidden-import netscan.settings ^
            --hidden-import netscan.wan ^
            --hidden-import netscan.sites ^
            --hidden-import netscan.agent ^
            --hidden-import netscan.oidc ^
            --hidden-import netscan.tlsutil ^
            --hidden-import netscan.apitokens ^
            --hidden-import netscan.netguard ^
            --hidden-import netscan.totp ^
            --hidden-import netscan.certs ^
            --hidden-import netscan.heartbeat ^
            --hidden-import netscan.fleet ^
            --hidden-import netscan.tailnet ^
            netsentinel.py

      - name: Smoke test the exe
        run: |
          .\dist\NetSentinel.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: NetSentinel-windows
          path: |
            dist/NetSentinel.exe
            README.md
            EULA.txt
            sbom.json
