# Builds Prahari.exe on a real Windows machine in the cloud - free for public repos.
#
#   Run workflow (Actions tab)  -> builds the exe; download "Prahari-windows" from the run page.
#   Push a tag  vX.Y.Z          -> also creates a DRAFT GitHub release with Prahari.exe and
#                                  Prahari-app.zip. Installed copies never see a draft.
#                                  On the publisher's Mac run:  python3 tools/sign_release.py vX.Y.Z
#                                  which signs latest.json and publishes the release; from then on
#                                  every Prahari picks the update up within 6 hours.
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $code = python -c "import netscan; print(netscan.__version__)"
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($code -ne $tag) { Write-Error "tag v$tag but netscan/__init__.py says $code"; exit 1 }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create throw-away Windows accounts for the sign-in test
        shell: pwsh
        run: |
          $p = "Ns-" + [guid]::NewGuid().ToString("N").Substring(0,16) + "!a1"
          Write-Output "::add-mask::$p"
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          New-LocalUser -Name nsadmintest -Password $sec -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group (Get-LocalGroup -SID "S-1-5-32-544").Name -Member nsadmintest
          New-LocalUser -Name nsusertest -Password $sec -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group (Get-LocalGroup -SID "S-1-5-32-545").Name -Member nsusertest
          "NS_TEST_WIN_ADMIN=nsadmintest" | Out-File -Append $env:GITHUB_ENV
          "NS_TEST_WIN_USER=nsusertest" | Out-File -Append $env:GITHUB_ENV
          "NS_TEST_WIN_PASS=$p" | Out-File -Append $env:GITHUB_ENV

      - name: Run the test suite (a failure stops the build)
        shell: cmd
        run: |
          python -m unittest discover -s tests -t . -v

      - name: Build the single-file exe
        shell: cmd
        run: |
          python sbom.py
          pyinstaller --noconfirm netsentinel.spec

      - name: Smoke test the exe (Claude SDK bundled, scapy not bundled, update key set)
        shell: cmd
        run: |
          dist\Prahari.exe --help
          dist\Prahari.exe --selftest-update

      - name: Prove the exe updates itself in place (signed, tamper refused)
        shell: cmd
        run: |
          python tools\ci_exe_update_test.py dist\Prahari.exe

      - name: Package the app code for source installs
        shell: pwsh
        run: |
          python -c "import os, zipfile; top=['netscan','netsentinel.py','requirements.txt','README.md','EULA.txt','sbom.json']; z=zipfile.ZipFile('dist/Prahari-app.zip','w',zipfile.ZIP_DEFLATED); [z.write(os.path.join(r,f), os.path.join(r,f).replace(os.sep,'/')) for t in top for r,d,fs in (os.walk(t) if os.path.isdir(t) else [('',[],[t])]) for f in fs if '__pycache__' not in r and not f.endswith('.pyc')]; z.close()"
          python -c "import zipfile; print(len(zipfile.ZipFile('dist/Prahari-app.zip').namelist()), 'files in Prahari-app.zip')"

      - uses: actions/upload-artifact@v4
        with:
          name: Prahari-windows
          path: |
            dist/Prahari.exe
            dist/Prahari-app.zip
            README.md
            EULA.txt
            LIMITS.md
            sbom.json

      - name: Draft the GitHub release (signed and published later from the Mac)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/Prahari.exe dist/Prahari-app.zip `
            --draft --title "Prahari ${{ github.ref_name }}" --generate-notes
